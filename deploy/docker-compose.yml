# Full stack: MongoDB (as a one-node replica set), the API, and nginx serving
# the Angular build.
#
# Expects the two repositories side by side:
#
#   /srv/codex/
#     codex-backend/codex/     <- this file lives in deploy/
#     codex-frontend/
#
# Run from this folder:  docker compose up -d --build

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # a replica set, even with one node, is what gives transactions and an
    # oplog to recover from. A standalone mongod has neither.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10

  # runs once, turns the fresh mongod into a replica set, then exits
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    command: >
      mongosh --host mongo --quiet --eval
      "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DATABASE_HOST: mongo
      DATABASE_PORT: '27017'
      DATABASE_NAME: ${DATABASE_NAME:-codex}
      PORT: '3000'
      APP_URL: ${APP_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # must be set in deploy/.env — the app refuses to start without it
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      JWT_EXPIRES: ${JWT_EXPIRES:-1d}
      # same origin through nginx, so no cross-site exception is needed
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      BACKUP_DIR: /app/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - api-uploads:/app/uploads
      # backups land on the host so they can be copied off the machine
      - ${BACKUP_HOST_DIR:-./backups}:/app/backups

  web:
    build:
      context: ../../../codex-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${HTTP_PORT:-80}:80'

volumes:
  mongo-data:
  api-uploads:
